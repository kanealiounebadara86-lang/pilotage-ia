# Pilotage.IA — déploiement complet : MySQL + Laravel + service IA Python + HTTPS automatique (Caddy).
# Les secrets viennent du fichier .env (jamais versionné) : voir .env.example et DEPLOIEMENT.md.
name: pilotage

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: si_intelligent
      MYSQL_USER: pilotage
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD manquant dans .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: ./si-intelligent
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Pilotage.IA
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY manquante dans .env}
      APP_URL: https://${DOMAIN:?DOMAIN manquant dans .env}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: si_intelligent
      DB_USERNAME: pilotage
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      AI_SERVICE_BASE_URL: http://ai:8001
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY manquante dans .env}
    volumes:
      - app_storage:/var/www/html/storage

  ai:
    build: ./ai-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: si_intelligent
      DB_USERNAME: pilotage
      DB_PASSWORD: ${DB_PASSWORD}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      MODELS_STORE_PATH: /app/models_store
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      LARAVEL_BASE_URL: http://app
    volumes:
      - ai_models:/app/models_store

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  app_storage:
  ai_models:
  caddy_data:
  caddy_config:
